# Server configuration
server.port=8080
spring.application.name=simple-mcp-server

# MongoDB configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=mcp_server_db
# spring.data.mongodb.username=admin
# spring.data.mongodb.password=password
# Uncomment and set username/password if authentication is enabled

# Spring AI MCP Server configuration
spring.ai.mcp.server.name=mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.sse-message-endpoint=/mcp/messages

# Logging configuration
logging.level.org.springframework.data.mongodb=INFO
logging.level.org.mongodb=INFO
logging.level.org.springframework.ai=INFO
